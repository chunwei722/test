<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>米寶的咖啡店</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3D2B">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bros Coffee">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#F4F5EE;
    --panel:#FFFFFF;
    --ink:#1E2A22;
    --ink-muted:#647163;
    --primary:#1F3D2B;
    --primary-light:#2E5940;
    --accent:#E8A33D;
    --accent-ink:#4A2F06;
    --line:#DDE2D3;
    --danger:#B0473B;
    --danger-bg:#F7E7E3;
    --ok:#3E7A52;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:76px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* header */
  header.top{
    background:var(--primary);
    color:#EFF3EC;
    padding:18px 18px 20px;
    border-radius:0 0 20px 20px;
  }
  header.top .shopname{font-size:19px;font-weight:700;letter-spacing:.3px;}
  header.top .date{font-size:12.5px;color:#B9CBBB;margin-top:3px;}

  /* tabs content */
  .screen{display:none;padding:14px 14px 10px;flex:1;}
  .screen.active{display:block;}

  /* product grid */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }
  .pcard{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    text-align:left;
    cursor:pointer;
    position:relative;
    transition:transform .12s ease, box-shadow .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .pcard:active{transform:scale(.96);}
  .pcard.out{opacity:.45;pointer-events:none;}
  .pcard .cat{font-size:11px;color:var(--ink-muted);}
  .pcard .name{font-size:15px;font-weight:700;margin:4px 0 8px;line-height:1.25;}
  .pcard .price{font-size:16px;font-weight:600;color:var(--primary);}
  .pcard .stockbadge{
    position:absolute;top:10px;right:10px;
    font-size:10.5px;
    padding:2px 7px;
    border-radius:20px;
    background:var(--danger-bg);
    color:var(--danger);
    font-weight:600;
  }
  .section-title{font-size:13px;color:var(--ink-muted);font-weight:600;margin:16px 2px 0;}

  /* bottom nav */
  nav.tabbar{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:480px;
    margin:0 auto;
    background:var(--panel);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:40;
  }
  nav.tabbar button{
    flex:1;
    background:none;border:none;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-family:inherit;
    font-size:11px;
    color:var(--ink-muted);
    padding:4px 0;
    cursor:pointer;
  }
  nav.tabbar button.active{color:var(--primary);font-weight:700;}
  nav.tabbar svg{width:20px;height:20px;}

  /* floating cart button */
  .cart-fab{
    position:fixed;
    bottom:82px;
    left:50%;
    transform:translateX(-50%);
    max-width:452px;
    width:calc(100% - 28px);
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:13px 16px;
    display:none;
    align-items:center;
    justify-content:space-between;
    font-family:inherit;
    font-size:14.5px;
    font-weight:700;
    box-shadow:0 6px 18px rgba(31,61,43,.35);
    z-index:35;
    cursor:pointer;
  }
  .cart-fab.show{display:flex;}
  .cart-fab .count{
    background:var(--accent);
    color:var(--accent-ink);
    border-radius:20px;
    padding:2px 9px;
    font-size:12.5px;
    margin-right:8px;
  }

  /* drawer / sheet */
  .overlay{
    position:fixed;inset:0;
    background:rgba(20,26,20,.45);
    display:none;
    z-index:50;
  }
  .overlay.show{display:block;}
  .sheet{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translate(-50%,100%);
    max-width:480px;
    width:100%;
    background:var(--panel);
    border-radius:20px 20px 0 0;
    max-height:88vh;
    overflow-y:auto;
    z-index:60;
    transition:transform .25s ease;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet.show{transform:translate(-50%,0);}
  .sheet-handle{width:38px;height:4px;background:var(--line);border-radius:4px;margin:2px auto 12px;}
  .sheet h3{margin:0 0 12px;font-size:16.5px;}

  .cartline{
    display:flex;align-items:center;gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .cartline .cname{flex:1;font-size:14px;font-weight:500;}
  .cartline .cprice{font-size:12.5px;color:var(--ink-muted);}
  .qtybox{display:flex;align-items:center;gap:8px;}
  .qtybox button{
    width:26px;height:26px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);font-size:15px;cursor:pointer;color:var(--ink);
  }
  .qtybox span{min-width:16px;text-align:center;font-size:14px;font-weight:600;}
  .lineTotal{width:58px;text-align:right;font-size:14px;font-weight:600;}

  .row{display:flex;align-items:center;justify-content:space-between;margin:8px 0;}
  .discount-row{display:flex;gap:8px;margin-top:10px;}
  .seg{
    display:flex;background:var(--bg);border-radius:10px;padding:3px;border:1px solid var(--line);
  }
  .seg button{
    border:none;background:none;padding:7px 12px;border-radius:8px;font-size:12.5px;
    font-family:inherit;cursor:pointer;color:var(--ink-muted);font-weight:600;
  }
  .seg button.active{background:var(--primary);color:#fff;}
  input[type=number], input[type=text]{
    font-family:inherit;
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 10px;
    font-size:14px;
    width:100%;
    background:var(--bg);
    color:var(--ink);
  }
  .payrow{display:flex;gap:8px;margin-top:8px;}
  .paybtn{
    flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;
    padding:10px 4px;font-size:12.5px;font-weight:600;color:var(--ink-muted);
    font-family:inherit;cursor:pointer;text-align:center;
  }
  .paybtn.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  .totalbar{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
  }
  .totalbar .lbl{font-size:13px;color:var(--ink-muted);}
  .totalbar .amt{font-size:22px;font-weight:700;color:var(--primary);}

  .btn-primary{
    width:100%;background:var(--primary);color:#fff;border:none;
    border-radius:12px;padding:14px;font-size:15px;font-weight:700;
    font-family:inherit;margin-top:14px;cursor:pointer;
  }
  .btn-primary:disabled{opacity:.4;}
  .btn-ghost{
    width:100%;background:none;color:var(--ink-muted);border:1px solid var(--line);
    border-radius:12px;padding:11px;font-size:13.5px;font-weight:600;
    font-family:inherit;margin-top:8px;cursor:pointer;
  }
  .btn-danger-text{background:none;border:none;color:var(--danger);font-family:inherit;font-size:12.5px;cursor:pointer;}

  /* product management */
  .prow{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;
  }
  .prow .pinfo{flex:1;}
  .prow .pname{font-size:14px;font-weight:700;}
  .prow .pmeta{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .prow .pmeta.low{color:var(--danger);font-weight:600;}
  .iconbtn{
    width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;
  }

  .field{margin-bottom:10px;}
  .field label{font-size:12px;color:var(--ink-muted);display:block;margin-bottom:4px;font-weight:600;}

  /* reports */
  .statcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .statcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;}
  .statcard .v{font-size:20px;font-weight:700;color:var(--primary);}
  .statcard .l{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
  .saleitem{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;margin-top:8px;
  }
  .saleitem .top{display:flex;justify-content:space-between;font-size:13px;}
  .saleitem .top .amt{font-weight:700;color:var(--primary);}
  .saleitem .meta{font-size:11.5px;color:var(--ink-muted);margin-top:3px;}

  .paybreak-row{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;margin-top:8px;
  }
  .paybreak-top{display:flex;justify-content:space-between;align-items:baseline;}
  .paybreak-name{font-size:13.5px;font-weight:700;}
  .paybreak-amt{font-size:15px;font-weight:700;color:var(--primary);}
  .paybreak-bar{height:6px;background:var(--bg);border-radius:6px;margin-top:8px;overflow:hidden;}
  .paybreak-fill{height:100%;background:var(--accent);border-radius:6px;}
  .paybreak-meta{font-size:11px;color:var(--ink-muted);margin-top:5px;}

  .export-btn{
    background:var(--accent);color:var(--accent-ink);border:none;
    border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:700;
    font-family:inherit;cursor:pointer;
  }
  .exprow{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;margin-top:8px;display:flex;align-items:center;gap:10px;
  }
  .exprow .einfo{flex:1;}
  .exprow .ename{font-size:14px;font-weight:700;}
  .exprow .emeta{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .exprow .eamt{font-size:14px;font-weight:700;color:var(--danger);}


  .empty{
    text-align:center;color:var(--ink-muted);font-size:13px;padding:40px 20px;
  }

  /* receipt modal */
  .receipt-paper{
    background:#FBFAF6;
    border:1px dashed var(--line);
    border-radius:10px;
    padding:18px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:#2A2A2A;
  }
  .receipt-paper .center{text-align:center;}
  .receipt-paper .rline{display:flex;justify-content:space-between;margin:3px 0;}
  .receipt-paper hr{border:none;border-top:1px dashed #BBB;margin:9px 0;}
  .modalbtns{display:flex;gap:8px;margin-top:14px;}
  .modalbtns button{flex:1;}

  #toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:9px 18px;border-radius:30px;
    font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:80;
  }
  #toast.show{opacity:1;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;}
  }
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="shopname" id="shopNameDisplay">Bros Coffee</div>
    <div class="date" id="todayDate"></div>
  </header>

  <!-- 收銀 -->
  <section class="screen active" id="screen-checkout">
    <div class="section-title">飲品菜單</div>
    <div class="grid" id="productGrid"></div>
  </section>

  <!-- 商品管理 -->
  <section class="screen" id="screen-products">
    <div class="row" style="margin-top:8px;">
      <div class="section-title" style="margin:0;">商品清單</div>
      <button class="iconbtn" onclick="openProductForm()">＋</button>
    </div>
    <div id="productList" style="margin-top:10px;"></div>
  </section>

  <!-- 報表 -->
  <section class="screen" id="screen-reports">
    <div class="row" style="margin-top:8px;">
      <div class="section-title" style="margin:0;">今日營運</div>
      <button class="export-btn" onclick="exportExcel()">匯出 Excel</button>
    </div>
    <div class="statcards" id="todayStats"></div>

    <div class="section-title">今日各付款方式</div>
    <div id="todayPayBreakdown"></div>

    <div class="section-title">累計各付款方式（全部紀錄）</div>
    <div id="allPayBreakdown"></div>

    <div class="row" style="margin-top:16px;">
      <div class="section-title" style="margin:0;">支出</div>
      <button class="iconbtn" onclick="openExpenseForm()">＋</button>
    </div>
    <div id="expenseList"></div>

    <div class="section-title">交易紀錄</div>
    <div id="salesList"></div>
    <button class="btn-ghost" onclick="clearAllSales()" style="color:var(--danger);border-color:var(--danger-bg);margin-top:16px;">清除所有交易紀錄</button>
  </section>

  <button class="cart-fab" id="cartFab" onclick="openSheet('cartSheet')">
    <span><span class="count" id="fabCount">0</span>查看購物車</span>
    <span class="mono" id="fabTotal">$0</span>
  </button>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="checkout" onclick="switchTab('checkout')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18l-2 11H5L3 6z"/><path d="M3 6L2 3H1"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
      收銀
    </button>
    <button class="tab-btn" data-tab="products" onclick="switchTab('products')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
      商品
    </button>
    <button class="tab-btn" data-tab="reports" onclick="switchTab('reports')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9"/><path d="M11 19V4"/><path d="M18 19v-7"/></svg>
      報表
    </button>
  </nav>
</div>

<!-- overlay -->
<div class="overlay" id="overlay" onclick="closeAllSheets()"></div>

<!-- cart sheet -->
<div class="sheet" id="cartSheet">
  <div class="sheet-handle"></div>
  <h3>購物車</h3>
  <div id="cartLines"></div>
  <div class="empty" id="cartEmpty" style="display:none;">還沒有加入任何商品</div>

  <div class="discount-row">
    <div class="seg" id="discSeg">
      <button class="active" data-t="percent" onclick="setDiscType('percent')">折扣 %</button>
      <button data-t="amount" onclick="setDiscType('amount')">折抵 $</button>
    </div>
    <input type="number" id="discValue" min="0" placeholder="0" oninput="renderCart()">
  </div>

  <div class="section-title" style="margin-top:14px;">付款方式</div>
  <div class="payrow" id="payRow">
    <button class="paybtn active" data-p="現金" onclick="setPay('現金')">現金</button>
    <button class="paybtn" data-p="信用卡" onclick="setPay('信用卡')">信用卡</button>
    <button class="paybtn" data-p="行動支付" onclick="setPay('行動支付')">行動支付</button>
  </div>

  <div class="totalbar">
    <span class="lbl">應收金額</span>
    <span class="amt mono" id="cartTotal">$0</span>
  </div>

  <button class="btn-primary" id="checkoutBtn" onclick="completeSale()">完成結帳</button>
  <button class="btn-ghost" onclick="closeAllSheets()">繼續加購</button>
</div>

<!-- product form sheet -->
<div class="sheet" id="productSheet">
  <div class="sheet-handle"></div>
  <h3 id="pFormTitle">新增商品</h3>
  <input type="text" id="pFormId" style="display:none;">
  <div class="field"><label>商品名稱</label><input type="text" id="pFormName" placeholder="例如：珍珠奶茶"></div>
  <div class="field"><label>分類</label><input type="text" id="pFormCat" placeholder="例如：奶茶類"></div>
  <div class="field"><label>售價（元）</label><input type="number" id="pFormPrice" min="0" placeholder="0"></div>
  <div class="field"><label>目前庫存</label><input type="number" id="pFormStock" min="0" placeholder="0"></div>
  <button class="btn-primary" onclick="saveProductForm()">儲存商品</button>
  <button class="btn-ghost" onclick="closeAllSheets()">取消</button>
</div>

<!-- receipt sheet -->
<div class="sheet" id="receiptSheet">
  <div class="sheet-handle"></div>
  <div id="printArea">
    <div class="receipt-paper" id="receiptContent"></div>
  </div>
  <div class="modalbtns">
    <button class="btn-ghost" onclick="window.print()">列印</button>
    <button class="btn-ghost" onclick="downloadReceipt()">下載文字檔</button>
  </div>
  <button class="btn-primary" onclick="closeAllSheets()">完成</button>
</div>

<!-- expense form sheet -->
<div class="sheet" id="expenseSheet">
  <div class="sheet-handle"></div>
  <h3 id="eFormTitle">新增支出</h3>
  <input type="text" id="eFormId" style="display:none;">
  <div class="field"><label>項目名稱</label><input type="text" id="eFormName" placeholder="例如：牛奶進貨"></div>
  <div class="field"><label>金額（元）</label><input type="number" id="eFormAmount" min="0" placeholder="0"></div>
  <div class="field"><label>分類</label><input type="text" id="eFormCat" placeholder="例如：進貨、水電、房租（選填）"></div>
  <div class="field"><label>日期</label><input type="date" id="eFormDate"></div>
  <button class="btn-primary" onclick="saveExpenseForm()">儲存支出</button>
  <button class="btn-ghost" onclick="closeAllSheets()">取消</button>
</div>

<div id="toast"></div>

<script>
let products = [];
let sales = [];
let expenses = [];
let cart = {}; // productId -> qty
let discType = 'percent';
let payMethod = '現金';
let lastReceiptText = '';

const STORAGE_KEY_PRODUCTS = 'pos:products';
const STORAGE_KEY_SALES = 'pos:sales';
const STORAGE_KEY_EXPENSES = 'pos:expenses';

const seedProducts = [
  {id:'p1', name:'美式咖啡', cat:'黑咖啡', price:60, stock:30},
  {id:'p2', name:'拿鐵', cat:'奶咖', price:75, stock:30},
  {id:'p3', name:'卡布奇諾', cat:'奶咖', price:75, stock:25},
  {id:'p4', name:'摩卡', cat:'奶咖', price:85, stock:20},
  {id:'p5', name:'手沖單品', cat:'黑咖啡', price:120, stock:15},
  {id:'p6', name:'冰滴咖啡', cat:'黑咖啡', price:95, stock:0},
  {id:'p7', name:'V寶的西西里', cat:'特調咖啡', price:115, stock:10},
  {id:'p7', name:'最好吃的meatball', cat:'小食', price:180, stock:5},
];

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY_PRODUCTS);
    products = raw ? JSON.parse(raw) : seedProducts;
  }catch(e){ products = seedProducts; }
  if(!products || products.length===0) products = seedProducts;

  try{
    const raw = localStorage.getItem(STORAGE_KEY_SALES);
    sales = raw ? JSON.parse(raw) : [];
  }catch(e){ sales = []; }

  try{
    const raw = localStorage.getItem(STORAGE_KEY_EXPENSES);
    expenses = raw ? JSON.parse(raw) : [];
  }catch(e){ expenses = []; }

  await saveProducts();
  renderAll();
}

async function saveProducts(){
  try{ localStorage.setItem(STORAGE_KEY_PRODUCTS, JSON.stringify(products)); }
  catch(e){ console.error('save products failed', e); showToast('儲存失敗,裝置空間可能不足'); }
}
async function saveSales(){
  try{ localStorage.setItem(STORAGE_KEY_SALES, JSON.stringify(sales)); }
  catch(e){ console.error('save sales failed', e); showToast('儲存失敗,裝置空間可能不足'); }
}
async function saveExpenses(){
  try{ localStorage.setItem(STORAGE_KEY_EXPENSES, JSON.stringify(expenses)); }
  catch(e){ console.error('save expenses failed', e); showToast('儲存失敗,裝置空間可能不足'); }
}

function fmt(n){ return '$' + Math.round(n).toLocaleString(); }

function todayStr(){
  const d = new Date();
  const days=['週日','週一','週二','週三','週四','週五','週六'];
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${days[d.getDay()]}`;
}

/* ---------- tabs ---------- */
function switchTab(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  if(name==='reports') renderReports();
  if(name==='products') renderProductList();
}

/* ---------- checkout / product grid ---------- */
function renderProductGrid(){
  const grid = document.getElementById('productGrid');
  grid.innerHTML='';
  products.forEach(p=>{
    const out = p.stock<=0;
    const low = !out && p.stock<=3;
    const card = document.createElement('div');
    card.className = 'pcard' + (out?' out':'');
    card.onclick = ()=>{ if(!out) addToCart(p.id); };
    card.innerHTML = `
      ${out?'<div class="stockbadge">已售完</div>':(low?`<div class="stockbadge">剩 ${p.stock}</div>`:'')}
      <div class="cat">${p.cat||''}</div>
      <div class="name">${p.name}</div>
      <div class="price mono">${fmt(p.price)}</div>
    `;
    grid.appendChild(card);
  });
}

function addToCart(id){
  const p = products.find(x=>x.id===id);
  const inCart = cart[id]||0;
  if(inCart >= p.stock){ showToast('庫存不足'); return; }
  cart[id] = inCart+1;
  updateFab();
  showToast(p.name+' 已加入');
}

function updateFab(){
  const ids = Object.keys(cart).filter(k=>cart[k]>0);
  const count = ids.reduce((s,k)=>s+cart[k],0);
  const fab = document.getElementById('cartFab');
  if(count>0){
    fab.classList.add('show');
    document.getElementById('fabCount').textContent = count;
    document.getElementById('fabTotal').textContent = fmt(cartSubtotal());
  } else {
    fab.classList.remove('show');
  }
}

function cartSubtotal(){
  return Object.keys(cart).reduce((sum,id)=>{
    const p = products.find(x=>x.id===id);
    return sum + (p? p.price*cart[id] : 0);
  },0);
}

function cartDiscountAmount(){
  const sub = cartSubtotal();
  const val = parseFloat(document.getElementById('discValue').value)||0;
  if(discType==='percent') return sub * Math.min(Math.max(val,0),100)/100;
  return Math.min(val, sub);
}

function renderCart(){
  const wrap = document.getElementById('cartLines');
  const ids = Object.keys(cart).filter(k=>cart[k]>0);
  wrap.innerHTML='';
  document.getElementById('cartEmpty').style.display = ids.length? 'none':'block';
  ids.forEach(id=>{
    const p = products.find(x=>x.id===id);
    if(!p) return;
    const row = document.createElement('div');
    row.className='cartline';
    row.innerHTML = `
      <div>
        <div class="cname">${p.name}</div>
        <div class="cprice mono">${fmt(p.price)} / 杯</div>
      </div>
      <div class="qtybox">
        <button onclick="changeQty('${id}',-1)">－</button>
        <span>${cart[id]}</span>
        <button onclick="changeQty('${id}',1)">＋</button>
      </div>
      <div class="lineTotal mono">${fmt(p.price*cart[id])}</div>
    `;
    wrap.appendChild(row);
  });
  const sub = cartSubtotal();
  const disc = cartDiscountAmount();
  const total = Math.max(sub-disc,0);
  document.getElementById('cartTotal').textContent = fmt(total);
  document.getElementById('checkoutBtn').disabled = ids.length===0;
  updateFab();
}

function changeQty(id, delta){
  const p = products.find(x=>x.id===id);
  const next = (cart[id]||0)+delta;
  if(next<=0){ delete cart[id]; }
  else if(next>p.stock){ showToast('庫存不足'); return; }
  else { cart[id]=next; }
  renderCart();
}

function setDiscType(t){
  discType=t;
  document.querySelectorAll('#discSeg button').forEach(b=>b.classList.toggle('active', b.dataset.t===t));
  renderCart();
}
function setPay(p){
  payMethod=p;
  document.querySelectorAll('#payRow .paybtn').forEach(b=>b.classList.toggle('active', b.dataset.p===p));
}

async function completeSale(){
  const ids = Object.keys(cart).filter(k=>cart[k]>0);
  if(ids.length===0) return;
  const sub = cartSubtotal();
  const disc = cartDiscountAmount();
  const total = Math.max(sub-disc,0);

  const items = ids.map(id=>{
    const p = products.find(x=>x.id===id);
    return {name:p.name, price:p.price, qty:cart[id]};
  });

  ids.forEach(id=>{
    const p = products.find(x=>x.id===id);
    p.stock = Math.max(0, p.stock - cart[id]);
  });
  await saveProducts();

  const sale = {
    id: 'S'+Date.now(),
    time: new Date().toISOString(),
    items, subtotal:sub, discount:disc, total, payMethod
  };
  sales.unshift(sale);
  await saveSales();

  cart = {};
  document.getElementById('discValue').value='';
  discType='percent'; setDiscType('percent');
  payMethod='現金'; setPay('現金');
  renderProductGrid();
  renderCart();

  showReceipt(sale);
}

/* ---------- receipt ---------- */
function showReceipt(sale){
  const shop = document.getElementById('shopNameDisplay').textContent;
  const t = new Date(sale.time);
  const timeStr = `${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;

  let lines = [];
  lines.push(`====  ${shop}  ====`);
  lines.push(`單號 ${sale.id}`);
  lines.push(timeStr);
  lines.push('--------------------------------');
  sale.items.forEach(it=>{
    lines.push(`${it.name} x${it.qty}`);
    lines.push(`  ${fmt(it.price)} x ${it.qty} = ${fmt(it.price*it.qty)}`);
  });
  lines.push('--------------------------------');
  lines.push(`小計 ${fmt(sale.subtotal)}`);
  if(sale.discount>0) lines.push(`折扣 -${fmt(sale.discount)}`);
  lines.push(`合計 ${fmt(sale.total)}`);
  lines.push(`付款方式 ${sale.payMethod}`);
  lines.push('================================');
  lines.push('謝謝惠顧');

  lastReceiptText = lines.join('\n');

  const html = `
    <div class="center" style="font-weight:600;font-size:14px;">${shop}</div>
    <div class="center" style="color:#777;margin-top:2px;">單號 ${sale.id}</div>
    <div class="center" style="color:#777;">${timeStr}</div>
    <hr>
    ${sale.items.map(it=>`
      <div class="rline"><span>${it.name} x${it.qty}</span><span>${fmt(it.price*it.qty)}</span></div>
    `).join('')}
    <hr>
    <div class="rline"><span>小計</span><span>${fmt(sale.subtotal)}</span></div>
    ${sale.discount>0?`<div class="rline"><span>折扣</span><span>-${fmt(sale.discount)}</span></div>`:''}
    <div class="rline" style="font-weight:700;font-size:14px;"><span>合計</span><span>${fmt(sale.total)}</span></div>
    <div class="rline"><span>付款方式</span><span>${sale.payMethod}</span></div>
    <hr>
    <div class="center">謝謝惠顧</div>
  `;
  document.getElementById('receiptContent').innerHTML = html;
  openSheet('receiptSheet');
}

function downloadReceipt(){
  const blob = new Blob([lastReceiptText], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '收據.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- product management ---------- */
function renderProductList(){
  const wrap = document.getElementById('productList');
  wrap.innerHTML='';
  products.forEach(p=>{
    const low = p.stock<=3;
    const row = document.createElement('div');
    row.className='prow';
    row.innerHTML = `
      <div class="pinfo">
        <div class="pname">${p.name} <span class="mono" style="color:var(--ink-muted);font-weight:500;">${fmt(p.price)}</span></div>
        <div class="pmeta ${low?'low':''}">${p.cat||'未分類'} · 庫存 ${p.stock}${p.stock<=0?'（已售完）':(low?'（庫存偏低）':'')}</div>
      </div>
      <button class="iconbtn" onclick="openProductForm('${p.id}')">✎</button>
      <button class="iconbtn" onclick="deleteProduct('${p.id}')">🗑</button>
    `;
    wrap.appendChild(row);
  });
}

function openProductForm(id){
  document.getElementById('pFormId').value = id||'';
  if(id){
    const p = products.find(x=>x.id===id);
    document.getElementById('pFormTitle').textContent='編輯商品';
    document.getElementById('pFormName').value=p.name;
    document.getElementById('pFormCat').value=p.cat||'';
    document.getElementById('pFormPrice').value=p.price;
    document.getElementById('pFormStock').value=p.stock;
  } else {
    document.getElementById('pFormTitle').textContent='新增商品';
    document.getElementById('pFormName').value='';
    document.getElementById('pFormCat').value='';
    document.getElementById('pFormPrice').value='';
    document.getElementById('pFormStock').value='';
  }
  openSheet('productSheet');
}

async function saveProductForm(){
  const id = document.getElementById('pFormId').value;
  const name = document.getElementById('pFormName').value.trim();
  const cat = document.getElementById('pFormCat').value.trim();
  const price = parseFloat(document.getElementById('pFormPrice').value)||0;
  const stock = parseInt(document.getElementById('pFormStock').value)||0;
  if(!name){ showToast('請輸入商品名稱'); return; }

  if(id){
    const p = products.find(x=>x.id===id);
    p.name=name; p.cat=cat; p.price=price; p.stock=stock;
  } else {
    products.push({id:'p'+Date.now(), name, cat, price, stock});
  }
  await saveProducts();
  renderProductGrid();
  renderProductList();
  closeAllSheets();
  showToast('商品已儲存');
}

async function deleteProduct(id){
  if(!confirm('確定要刪除這項商品嗎？')) return;
  products = products.filter(x=>x.id!==id);
  delete cart[id];
  await saveProducts();
  renderProductGrid();
  renderProductList();
  renderCart();
}

/* ---------- reports ---------- */
function renderReports(){
  const today = new Date().toDateString();
  const todaySales = sales.filter(s=> new Date(s.time).toDateString()===today);
  const todayExpenses = expenses.filter(e=> new Date(e.date).toDateString()===today);
  const revenue = todaySales.reduce((s,x)=>s+x.total,0);
  const expenseTotal = todayExpenses.reduce((s,x)=>s+x.amount,0);
  const profit = revenue - expenseTotal;

  document.getElementById('todayStats').innerHTML = `
    <div class="statcard"><div class="v mono">${fmt(revenue)}</div><div class="l">今日營收</div></div>
    <div class="statcard"><div class="v mono">${todaySales.length}</div><div class="l">今日訂單數</div></div>
    <div class="statcard"><div class="v mono" style="color:var(--danger);">${fmt(expenseTotal)}</div><div class="l">今日支出</div></div>
    <div class="statcard"><div class="v mono" style="color:${profit>=0?'var(--ok)':'var(--danger)'};">${fmt(profit)}</div><div class="l">今日淨利</div></div>
  `;

  renderPayBreakdown('todayPayBreakdown', todaySales);
  renderPayBreakdown('allPayBreakdown', sales);
  renderExpenseList();

  const list = document.getElementById('salesList');
  if(sales.length===0){
    list.innerHTML = '<div class="empty">還沒有任何交易紀錄</div>';
    return;
  }
  list.innerHTML = sales.slice(0,50).map(s=>{
    const t = new Date(s.time);
    const timeStr = `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    const itemStr = s.items.map(it=>`${it.name}x${it.qty}`).join('、');
    return `
      <div class="saleitem">
        <div class="top"><span>${timeStr} · ${s.payMethod}</span><span class="amt mono">${fmt(s.total)}</span></div>
        <div class="meta">${itemStr}</div>
      </div>
    `;
  }).join('');
}

/* ---------- expenses ---------- */
function renderExpenseList(){
  const wrap = document.getElementById('expenseList');
  if(expenses.length===0){
    wrap.innerHTML = '<div class="empty" style="padding:16px 0;">還沒有任何支出紀錄</div>';
    return;
  }
  const sorted = [...expenses].sort((a,b)=> new Date(b.date)-new Date(a.date));
  wrap.innerHTML = sorted.slice(0,50).map(e=>`
    <div class="exprow">
      <div class="einfo">
        <div class="ename">${e.name}</div>
        <div class="emeta">${e.date}${e.cat?' · '+e.cat:''}</div>
      </div>
      <div class="eamt mono">-${fmt(e.amount)}</div>
      <button class="iconbtn" onclick="deleteExpense('${e.id}')">🗑</button>
    </div>
  `).join('');
}

function openExpenseForm(){
  document.getElementById('eFormId').value='';
  document.getElementById('eFormName').value='';
  document.getElementById('eFormAmount').value='';
  document.getElementById('eFormCat').value='';
  document.getElementById('eFormDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('eFormTitle').textContent='新增支出';
  openSheet('expenseSheet');
}

async function saveExpenseForm(){
  const name = document.getElementById('eFormName').value.trim();
  const amount = parseFloat(document.getElementById('eFormAmount').value)||0;
  const cat = document.getElementById('eFormCat').value.trim();
  const date = document.getElementById('eFormDate').value || new Date().toISOString().slice(0,10);
  if(!name){ showToast('請輸入項目名稱'); return; }
  if(amount<=0){ showToast('請輸入正確金額'); return; }

  expenses.unshift({ id:'E'+Date.now(), name, amount, cat, date });
  await saveExpenses();
  renderReports();
  closeAllSheets();
  showToast('支出已新增');
}

async function deleteExpense(id){
  if(!confirm('確定要刪除這筆支出嗎？')) return;
  expenses = expenses.filter(x=>x.id!==id);
  await saveExpenses();
  renderReports();
}

function renderPayBreakdown(elId, saleList){
  const wrap = document.getElementById(elId);
  if(!wrap) return;
  const methods = ['現金','信用卡','行動支付'];
  const stats = {};
  methods.forEach(m=> stats[m] = {count:0, amount:0});
  saleList.forEach(s=>{
    if(!stats[s.payMethod]) stats[s.payMethod] = {count:0, amount:0};
    stats[s.payMethod].count += 1;
    stats[s.payMethod].amount += s.total;
  });
  const totalAmount = saleList.reduce((s,x)=>s+x.total,0);
  const keys = Object.keys(stats).filter(k=> stats[k].count>0 || methods.includes(k));
  if(saleList.length===0){
    wrap.innerHTML = '<div class="empty" style="padding:16px 0;">尚無交易</div>';
    return;
  }
  wrap.innerHTML = keys.map(k=>{
    const st = stats[k];
    const pct = totalAmount>0 ? Math.round(st.amount/totalAmount*100) : 0;
    return `
      <div class="paybreak-row">
        <div class="paybreak-top">
          <span class="paybreak-name">${k}</span>
          <span class="paybreak-amt mono">${fmt(st.amount)}</span>
        </div>
        <div class="paybreak-bar"><div class="paybreak-fill" style="width:${pct}%"></div></div>
        <div class="paybreak-meta">${st.count} 筆 · 佔比 ${pct}%</div>
      </div>
    `;
  }).join('');
}

async function clearAllSales(){
  if(!confirm('確定要清除所有交易紀錄嗎？此動作無法復原。')) return;
  sales = [];
  await saveSales();
  renderReports();
  showToast('已清除交易紀錄');
}

/* ---------- excel export ---------- */
function exportExcel(){
  if(typeof XLSX === 'undefined'){
    showToast('匯出功能需要網路連線,請連上網路後再試一次');
    return;
  }
  const salesRows = sales.map(s=>({
    單號: s.id,
    時間: new Date(s.time).toLocaleString('zh-TW'),
    品項: s.items.map(it=>`${it.name}x${it.qty}`).join('、'),
    小計: s.subtotal,
    折扣: s.discount,
    合計: s.total,
    付款方式: s.payMethod
  }));
  const expenseRows = expenses.map(e=>({
    日期: e.date,
    項目: e.name,
    分類: e.cat||'',
    金額: e.amount
  }));
  const totalRevenue = sales.reduce((s,x)=>s+x.total,0);
  const totalExpense = expenses.reduce((s,x)=>s+x.amount,0);
  const byPay = {};
  sales.forEach(s=>{ byPay[s.payMethod] = (byPay[s.payMethod]||0) + s.total; });

  const summaryRows = [
    {項目:'總營收', 金額: totalRevenue},
    {項目:'總支出', 金額: totalExpense},
    {項目:'淨利', 金額: totalRevenue - totalExpense},
    {項目:'', 金額:''},
    ...Object.keys(byPay).map(k=>({項目:`${k} 收款`, 金額: byPay[k]}))
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows), '摘要');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(salesRows), '收入明細');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expenseRows), '支出明細');

  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `BrosCoffee_報表_${dateStr}.xlsx`);
}

/* ---------- sheets ---------- */
function openSheet(id){
  document.getElementById('overlay').classList.add('show');
  document.getElementById(id).classList.add('show');
  if(id==='cartSheet') renderCart();
}
function closeAllSheets(){
  document.getElementById('overlay').classList.remove('show');
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'));
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

function renderAll(){
  document.getElementById('todayDate').textContent = todayStr();
  renderProductGrid();
  renderProductList();
  renderReports();
  renderCart();
}

loadData();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((e) => console.log('SW registration failed', e));
  });
}

</script>
